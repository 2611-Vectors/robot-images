name: Images

# Builds your computers' images with Paddock. Push a tag named images-<something> (or run this by
# hand with a release name) to publish them as a release; a change to what they're built from builds
# them as this run's artifacts, to check it.
on:
  push:
    branches: [main]
    paths: [paddock.yaml, "setup/**", "files/**", "keys/**"]
    tags: ["images-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release to cut, such as images-2027.1 (empty: build only)"
        default: ""

permissions:
  contents: read

jobs:
  # The lines in files/ the boards depend on (test/files_test.sh), before anything is built.
  files:
    name: Check the files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a commit (the version beside it), so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yq
        env:
          YQ_URL: https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/bin/yq" "$YQ_URL"
          echo "$YQ_SHA256  $RUNNER_TEMP/bin/yq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: test/files_test.sh
        run: test/files_test.sh

  images:
    needs: files
    # The template's own repository publishes nothing: its input is an example (team 0's addresses).
    # Run there by hand with no release name, it builds the example's images as the run's artifacts,
    # to check them.
    if: >-
      github.repository != 'mikegrundvig/frc-paddock-starter' ||
      (github.event_name == 'workflow_dispatch' && inputs.release == '')
    # Paddock pinned to a commit (the version beside it), so your images change only when this
    # repository does: a tag can be moved, a commit can't.
    uses: mikegrundvig/frc-paddock/.github/workflows/build-images.yml@29800ce7f70e97208f4163264e3396073c267236 # v1.0.0
    permissions:
      contents: write
    with:
      release: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
