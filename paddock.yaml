# Your robot's computer images, built by Paddock (https://github.com/mikegrundvig/frc-paddock):
# each image is a base and what's added to it; each computer gets its own copy, stamped with its
# hostname and address. README.md says how to change it, and Paddock's README says every key.
images:
  # A vision computer running Visor (github.com/mikegrundvig/frc-visor): plain Armbian for the Orange
  # Pi 5 (Debian, Rockchip's kernel), with Spotter's agent, through which the robot program installs
  # and configures Visor as it starts (frc-robot-runtime's docs/visor.md). The computer is its
  # cameras and its address: nothing of a robot's is in the image, so a spare flashed from it works.
  visor:
    from:
      url: https://dl.armbian.com/orangepi5/archive/Armbian_26.8.1_Orangepi5_trixie_vendor_6.1.115_minimal.img.xz
      sha256: 8e2c7217a60888c0cf487a85d445b3ee8ea4f533c2293df12d36ccfc6437e040
    grow: 1G
    steps:
      # Spotter's agent, the robot's way in (github.com/mikegrundvig/frc-spotter's releases list each
      # file's SHA-256), and the robot controller it takes the robot's pushes and actions from:
      # agent.json is that address's one place (chrony's is written from it).
      - package: https://github.com/mikegrundvig/frc-spotter/releases/download/v0.4.2/frc-spotter_0.4.2_arm64.deb
        sha256: 5d88313ff2c094cf7cdb1024f89a88069d4197ffa71157580fdc1a88ef16ea4d
      - file: files/visor/agent.json
        to: /etc/frc-spotter/agent.json
        mode: "0644"
      # The same release's source, for its catalog's debian pack (setup/visor-orangepi.sh). Move it
      # with the package: the tag in both is the same.
      - download: https://github.com/mikegrundvig/frc-spotter/archive/refs/tags/v0.4.2.tar.gz
        sha256: 5ec9f33cee9cda8f23009f79187b05bf4cf0b88f724393bda85b123a173c69ce
        to: /usr/local/share/frc-spotter/source.tar.gz
      # The agent waits for the kept paths it writes.
      - file: files/frc-spotter.conf
        to: /etc/systemd/system/frc-spotter.service.d/10-team.conf
        mode: "0644"
      # A Visor release, for its program and what the image needs for it, its os/ (its account, its
      # folder, its unit, and what its pack needs of the agent: setup/visor-orangepi.sh), kept where
      # it's put: the robot installs its own version over the program.
      - download: https://github.com/mikegrundvig/frc-visor/releases/download/v2026.11.9/visor-2026.11.9-linux-arm64.tar.gz
        sha256: 869876dc7c70387d291d5a30802b22e70cdf9c4aca0ef45fdb6a773e06ce3acd
        to: /opt/visor/.release.tar.gz
      # `visor` for people, root's: it runs the robot's Visor in /opt/visor, but never as root.
      - file: files/visor/visor
        to: /usr/local/bin/visor
        mode: "0755"
      # This board's part of Visor's unit: its fast cores, and /opt/visor on the data partition.
      - file: files/visor/visor-service.conf
        to: /etc/systemd/system/visor.service.d/10-team.conf
        mode: "0644"
      - file: files/visor/cpu-performance.service
        to: /etc/systemd/system/cpu-performance.service
        mode: "0644"
      # Logins by SSH key only, each drive with its own host key; NetworkManager's settings; the
      # journal kept and synced; e2fsck that copes with no clock battery.
      - file: files/sshd.conf
        to: /etc/ssh/sshd_config.d/10-team.conf
        mode: "0644"
      - file: files/ssh-hostkey.service
        to: /etc/systemd/system/ssh-hostkey.service
        mode: "0644"
      - file: files/NetworkManager.conf
        to: /etc/NetworkManager/conf.d/90-team.conf
        mode: "0644"
      - file: files/journald.conf
        to: /etc/systemd/journald.conf.d/70-team.conf
        mode: "0644"
      - file: files/e2fsck.conf
        to: /etc/e2fsck.conf
        mode: "0644"
      # NetworkManager, chrony, Spotter's debian pack, Visor's part of the image, and the admin
      # login; then what a robot computer from this Armbian base needs (each script says why).
      - run: setup/visor-orangepi.sh
      - run: setup/armbian-robot.sh
    read-only:
      data: 2G
      # Visor (the robot installs it), the packs the robot pushes, and the journal; chrony's drift
      # file needn't last.
      keep: [/opt/visor, /var/lib/frc-spotter, /var/log/journal]
      ram: [/var/lib/chrony]
    # Checked in a copy of the image booted on the build machine, before any computer is stamped:
    # Spotter's agent up, and Visor's program running (test/boot_check.sh).
    boot:
      check: test/boot_check.sh

computers:
  # Numbered, not named for a place on the robot: vision-N is 10.26.11.1N. Which cameras a board
  # carries is the robot's code, which lists each board by its address,
  # .withCoprocessors("10.26.11.11", "10.26.11.12").
  - hostname: vision-1
    image: visor
    address: 10.26.11.11/24
    gateway: 10.26.11.4
  - hostname: vision-2
    image: visor
    address: 10.26.11.12/24
    gateway: 10.26.11.4
