# Spotter's agent on this read-only root: it writes two kept paths (paddock.yaml's keep), /opt/visor
# for Visor's pack (Visor's release grants it, with a drop-in of its own) and /var/lib/frc-spotter
# for pushed packs (the agent's own unit does), and waits for their mounts from the data partition.
#
# It waits, but doesn't require them. If the data partition fails to mount (a bad card), the agent
# still starts, so the robot still sees the board and the debian pack can report the disk; Visor
# alone requires its mount (visor-service.conf). A mount's unit is named by `systemd-escape --path`,
# which writes the "-" in frc-spotter as \x2d.
[Unit]
After=opt-visor.mount var-lib-frc\x2dspotter.mount
