# chrony on a Visor computer: the clock follows the robot program's, which answers NTP on UDP 5806
# with its own clock (Visor's deploy/chrony.conf says why each line is so). Your robot controller's
# address: 10.TE.AM.2 (team 1234: 10.12.34.2).
server 10.26.11.2 port 5806 iburst minpoll -3 maxpoll 0
# Step the clock whenever it's more than 0.1 s off, not only at start: a rebooted robot controller
# starts its clock again from zero.
makestep 0.1 -1
# Required: without rtcsync, chrony on Linux never clears the kernel's "unsynchronised" flag, even
# while it follows the robot's clock. Visor reads that flag to mark each frame's time as synced, so
# without this line the robot discards every frame. (It also lets the kernel copy the time to the
# board's real-time clock every 11 minutes, which does no harm.)
rtcsync
# No other time source: robot time is the only one that matters here. The drift file is in RAM
# (paddock.yaml), so each boot learns the drift again, in seconds at this rate.
driftfile /var/lib/chrony/chrony.drift
