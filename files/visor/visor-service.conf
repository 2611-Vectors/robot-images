# This board's part of Visor's unit (the unit itself, and its wait for the robot's configuration,
# come with Visor's release). /opt/visor is on the data partition. Visor's threads run on the
# RK3588's fast cores: on the Orange Pi 5, cores 4-7 are the Cortex-A76s.
[Unit]
RequiresMountsFor=/opt/visor

[Service]
CPUAffinity=4-7
