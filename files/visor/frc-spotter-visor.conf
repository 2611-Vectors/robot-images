# What Visor's Spotter pack needs of the agent (Visor's spotter/visor/README.md): it installs Visor
# and its configuration into /opt/visor, kept on the data partition.
#
# The agent waits for the kept paths' mounts but doesn't require them. If the data partition fails
# to mount (a bad card), the agent still starts, so the robot still sees the board and the debian
# pack can report the disk; Visor alone requires its mount (visor-service.conf). The "-" lets the
# agent start when a path can't be made writable. A mount's unit is named by `systemd-escape --path`,
# which writes the "-" in frc-spotter as \x2d.
[Unit]
After=opt-visor.mount var-lib-frc\x2dspotter.mount

[Service]
ReadWritePaths=-/opt/visor -/var/lib/frc-spotter
